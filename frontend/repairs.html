<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repairs & Upgrades — Bra Kay Autotech</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html">
        <img src="assets/logo.png" alt="Bra Kay Autotech" class="logo-img" />
      </a>
      <nav class="header-nav">
        <a href="index.html">Home</a>
        <a href="repairs.html" class="active-link">Repairs &amp; Upgrades</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container hero-inner">
      <p class="eyebrow">Bring your own car in</p>
      <h1>Repairs &amp; upgrades,<br />done right.</h1>
      <p class="hero-sub">
        Tell us what your car needs — from routine repairs to performance
        upgrades — and we'll get back to you to schedule it.
      </p>
    </div>
  </section>

  <section class="admin-section">
    <div class="container">
      <form id="service-form" class="admin-form" style="max-width: 620px; margin: 0 auto;">
        <h2>Request repair or upgrade work</h2>

        <div class="form-grid">
          <div class="field">
            <label for="serviceType">Type of service</label>
            <select id="serviceType" required>
              <option value="repair">Repair</option>
              <option value="upgrade">Upgrade</option>
            </select>
          </div>
          <div class="field">
            <label for="preferredDate">Preferred date (optional)</label>
            <input type="date" id="preferredDate" />
          </div>
        </div>

        <div class="form-grid">
          <div class="field">
            <label for="carMake">Car make</label>
            <input type="text" id="carMake" required placeholder="Toyota" />
          </div>
          <div class="field">
            <label for="carModel">Car model</label>
            <input type="text" id="carModel" required placeholder="Corolla" />
          </div>
          <div class="field">
            <label for="carYear">Car year</label>
            <input type="number" id="carYear" required placeholder="2019" min="1970" max="2030" />
          </div>
        </div>

        <div class="field full-width">
          <label for="description">What does your car need?</label>
          <textarea id="description" rows="4" required placeholder="Describe the issue or the upgrade you want..."></textarea>
        </div>

        <div class="field full-width">
          <label for="customerName">Full name</label>
          <input type="text" id="customerName" required />
        </div>
        <div class="form-grid">
          <div class="field">
            <label for="customerPhone">Phone</label>
            <input type="tel" id="customerPhone" required />
          </div>
        </div>

        <p id="service-error" class="login-error" hidden></p>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="service-submit-btn">Send request</button>
        </div>
      </form>
    </div>
  </section>

  <!-- ============ FOOTER ============ -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <img src="assets/logo.png" alt="Bra Kay Autotech" class="footer-logo-img" />
      <p class="footer-tagline">A car sales &amp; rental marketplace.</p>

                     <div class="footer-socials">
        <a href="https://instagram.com/bra_kay2026" aria-label="Instagram" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </a>
        <a href="https://tiktok.com/@brakaycar_house" aria-label="TikTok" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path>
          </svg>
        </a>
        <a href="https://snapchat.com/add/bra_kay155" aria-label="Snapchat" target="_blank" rel="noopener">

      </div>
      <div class="footer-legal">© 2026 Bra Kay Autotech</div>

</body>
</html>
