<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Bra Kay Motorline</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">BRA KAY <span>MOTORLINE</span></a>
    </div>
  </header>

  <section class="login-section">
    <div class="container">
      <form id="login-form" class="login-form">
        <h1>Admin Login</h1>
        <p class="admin-sub">Sign in to manage car listings.</p>

        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>

        <p id="login-error" class="login-error" hidden></p>

        <button type="submit" class="btn btn-primary" id="login-btn">Sign in</button>
      </form>
    </div>
  </section>

  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
