<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Bra Kay Motorline</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">BRA KAY <span>MOTORLINE</span></a>
      <nav class="main-nav">
        <a href="index.html#listings">Inventory</a>
        <a href="admin.html" class="active-link">Admin</a>
        <a href="admin-bookings.html">Bookings</a>
        <a href="#" id="logout-link">Log out</a>
      </nav>
    </div>
  </header>

  <section class="admin-section">
    <div class="container">
      <div class="admin-header">
        <h1>Admin Panel</h1>
        <p class="admin-sub">Add, edit, or remove car listings. Changes go straight to the database.</p>
      </div>

      <!-- ============ ADD / EDIT FORM ============ -->
      <form id="car-form" class="admin-form">
        <input type="hidden" id="car-id" />

        <h2 id="form-heading">Add a new car</h2>

        <div class="form-grid">
          <div class="field">
            <label for="make">Make</label>
            <input type="text" id="make" required placeholder="Toyota" />
          </div>
          <div class="field">
            <label for="model">Model</label>
            <input type="text" id="model" required placeholder="Corolla" />
          </div>
          <div class="field">
            <label for="year">Year</label>
            <input type="number" id="year" required placeholder="2022" min="1980" max="2030" />
          </div>
          <div class="field">
            <label for="listing-type">Listing type</label>
            <select id="listing-type" required>
              <option value="sale">For sale</option>
              <option value="rent">For rent</option>
            </select>
          </div>
          <div class="field">
            <label for="price">Price (per day if renting)</label>
            <input type="number" id="price" required placeholder="15000" min="0" />
          </div>
          <div class="field">
            <label for="mileage">Mileage</label>
            <input type="number" id="mileage" required placeholder="22000" min="0" />
          </div>
          <div class="field">
            <label for="transmission">Transmission</label>
            <select id="transmission">
              <option value="Automatic">Automatic</option>
              <option value="Manual">Manual</option>
            </select>
          </div>
          <div class="field">
            <label for="fuel">Fuel type</label>
            <select id="fuel">
              <option value="Petrol">Petrol</option>
              <option value="Diesel">Diesel</option>
              <option value="Hybrid">Hybrid</option>
              <option value="Electric">Electric</option>
            </select>
          </div>
          <div class="field">
            <label for="color">Color</label>
            <input type="text" id="color" placeholder="Silver" />
          </div>
          <div class="field">
            <label for="seats">Seats</label>
            <input type="number" id="seats" placeholder="5" min="1" max="9" />
          </div>
        </div>

        <div class="field full-width">
          <label for="description">Description</label>
          <textarea id="description" rows="3" placeholder="A short description of the car..."></textarea>
        </div>

        <div class="field full-width">
          <label for="features">Features (comma-separated)</label>
          <input type="text" id="features" placeholder="Bluetooth, Backup camera, Sunroof" />
        </div>

        <div class="field full-width">
          <label for="photos">Car photos (up to 5)</label>
          <input type="file" id="photos" accept="image/*" multiple />
          <p class="upload-hint" id="upload-hint">No photos selected yet.</p>
          <div class="photo-preview-grid" id="photo-preview-grid"></div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">Add car</button>
          <button type="button" class="btn btn-outline" id="cancel-edit-btn" hidden>Cancel edit</button>
        </div>
      </form>

      <!-- ============ EXISTING LISTINGS TABLE ============ -->
      <div class="admin-list-header">
        <h2>Current listings</h2>
      </div>
      <div id="admin-list" class="admin-list"></div>
    </div>
  </section>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
